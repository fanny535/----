<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="一款以 Canvas 打造的離線小恐龍跑酷遊戲。">
    <title>小恐龍・荒野疾行</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="小恐龍・荒野疾行首頁">
          <span class="brand-mark" aria-hidden="true">▰</span>
          <span>荒野疾行<span class="brand-dot">.</span></span>
        </a>
        <div class="topbar-note"><span class="status-dot"></span>離線也能玩</div>
      </header>

      <section class="game-shell" aria-label="小恐龍跑酷遊戲">
        <div class="game-heading">
          <div>
            <p class="eyebrow">一場說走就走的冒險</p>
            <h1>準備好，向前跑。</h1>
          </div>
          <div class="scoreboard" aria-label="分數">
            <div class="score-card">
              <span class="score-label">本次得分</span>
              <strong id="score">00000</strong>
            </div>
            <div class="score-card best-score">
              <span class="score-label">最高紀錄</span>
              <strong id="best-score">00000</strong>
            </div>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="game-canvas" width="960" height="360" aria-label="小恐龍跑酷遊戲畫面" role="img"></canvas>
          <div class="game-overlay" id="game-overlay">
            <div class="overlay-card">
              <span class="overlay-icon" id="overlay-icon" aria-hidden="true">↗</span>
              <p class="overlay-kicker" id="overlay-kicker">荒野正在等你</p>
              <h2 id="overlay-title">開始奔跑吧！</h2>
              <p class="overlay-copy" id="overlay-copy">跳過仙人掌、躲開飛鳥，看看你能跑多遠。</p>
              <button class="primary-button" id="start-button" type="button">開始遊戲 <span aria-hidden="true">→</span></button>
            </div>
          </div>
          <div class="pause-indicator" id="pause-indicator" hidden>已暫停</div>
        </div>

        <div class="game-footer">
          <div class="controls-hint">
            <span class="keycap">空白鍵</span><span class="keycap">↑</span><span>跳躍</span>
            <span class="hint-divider">·</span>
            <span class="keycap">↓</span><span>蹲下</span>
            <span class="hint-divider">·</span>
            <span class="keycap">X</span><span>防護</span>
          </div>
          <div class="game-actions">
            <p class="storage-note" id="storage-note" aria-live="polite">你的最高分會自動儲存</p>
            <button class="skill-button" id="shield-button" type="button" aria-label="啟動防護技能" title="防護技能（X）" disabled>
              <span class="skill-icon" aria-hidden="true">◇</span>
              <span id="shield-button-label">防護</span>
            </button>
            <button class="icon-button" id="pause-button" type="button" aria-label="暫停遊戲" title="暫停 / 繼續" disabled>
              <span id="pause-button-icon" aria-hidden="true">Ⅱ</span>
            </button>
          </div>
        </div>

        <div class="touch-controls" aria-label="觸控操作">
          <button class="touch-button jump-button" id="jump-button" type="button">
            <span aria-hidden="true">↑</span>跳躍
          </button>
          <button class="touch-button duck-button" id="duck-button" type="button">
            <span aria-hidden="true">↓</span>按住蹲下
          </button>
        </div>
      </section>

      <footer class="page-footer">
        <span>簡單的規則，無盡的旅程。</span>
        <span>用一點點勇氣，跑遠一點點。</span>
      </footer>
    </main>
  </body>
</html>
